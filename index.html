<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Destroyer</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    font-family: "Arial Rounded MT Bold", "Arial Rounded", Arial, sans-serif;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

img {
    pointer-events: none;
}

.player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    z-index: 200;
    pointer-events: none;
}

.player-dot {
    position: absolute;
    width: 16px;
    height: 16px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #fff;
    box-shadow:
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 30px rgba(255,255,255,.6);
    transition: background 0.1s, box-shadow 0.1s;
}

.player-dot.hurt {
    background: #ff0000;
    box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
}

.player-pointer {
    position: absolute;
    width: 0;
    height: 0;
    top: 0;
    left: 0;
}

.player-triangle {
    position: absolute;
    left: 13px;
    top: -5px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 9px solid #fff;
    filter:
        drop-shadow(0 0 6px #fff)
        drop-shadow(0 0 10px #fff);
}

.player-hp-container {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 200px;
    z-index: 300;
    pointer-events: none;
}

.player-hp-bar {
    width: 100%;
    height: 14px;
    background: #1a0000;
    border: 2px solid #800000;
    border-radius: 9999px;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(255,0,0,.3);
}

.player-hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,#cc0000,#ff3333);
    box-shadow: 0 0 8px #ff0000;
    border-radius: 9999px;
    transition: width 0.1s ease-out;
}

.player-hp-text {
    margin-top: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .8px;
    text-shadow: 0 0 6px rgba(255,0,0,.8);
}

.boss-hp-container {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    max-width: 80vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 300;
    pointer-events: none;
}

.boss-hp-bar {
    width: 100%;
    height: 15px;
    background: #1f0000;
    border: 1.5px solid rgba(255,40,40,.7);
    border-radius: 9999px;
    overflow: hidden;
    box-shadow:
        0 0 12px rgba(255,0,0,.55),
        inset 0 0 6px rgba(0,0,0,.9);
}

.boss-hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,#990000,#ff1a1a);
    box-shadow: 0 0 10px #ff0000;
    border-radius: 9999px;
    transition: width .12s ease-out;
}

.boss-hp-name {
    margin-top: 6px;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow:
        0 0 8px rgba(255,0,0,.9),
        0 0 3px #000;
    text-align: center;
}

.destroyer-layer {
    position: absolute;
    left: 50%;
    top: 20px;
    width: 704px;
    height: 354px;
    transform-origin: top center;
    pointer-events: none;
}

#destroyer-scene-back { z-index: 120; }
#destroyer-scene-front { z-index: 140; }

.destroyer-layer img, .destroyer-layer div {
    position: absolute;
    display: block;
}

#wingbackgroundleft { 
    left: 79px; top: 17px; width: 202px; height: 217px; z-index: 1; 
    transform-origin: 90% 40%;
    transition: transform 0.05s linear;
}
#wingbackgroundright { 
    left: 399px; top: 17px; width: 202px; height: 217px; z-index: 1; 
    transform-origin: 10% 40%;
    transition: transform 0.05s linear;
}
#wingleft { 
    left: 28px; top: 122px; width: 255px; height: 144px; z-index: 2; 
    transform-origin: 90% 50%;
    transition: transform 0.05s linear;
}
#rwingright { 
    left: 399px; top: 122px; width: 255px; height: 144px; z-index: 2; 
    transform-origin: 10% 50%;
    transition: transform 0.05s linear;
}
#body2 { left: 305px; top: 176px; width: 78px; height: 75px; z-index: 4; }

#handleft, #handright {
    width: 40px; height: 48px; z-index: 3;
    transition: left 0.7s linear, top 0.7s linear, transform 0.7s linear;
}
#handleft { left: 293px; top: 263px; }
#handright { left: 355px; top: 263px; }

#red-ball {
    left: 344px;
    top: 300px;
    transform: translate(-50%, -50%);
    width: 0px; 
    height: 0px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff8888 0%, #ff0000 40%, #880000 100%);
    box-shadow: 0 0 0px #ff0000;
    transition: width 1s ease, height 1s ease, box-shadow 1s ease;
    z-index: 3;
}

#red-ball.active {
    width: 45px;
    height: 45px;
    box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
}

#red-ball.pulsing {
    animation: redBallPulse 0.4s infinite alternate;
}

@keyframes redBallPulse {
    from { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 20px #ff0000; }
    to { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 35px #ff0000, 0 0 60px #ff0000; }
}

#pupil-container {
    left: 0; top: 0; width: 100%; height: 100%; z-index: 5;
}
#pupil { 
    left: 328px; top: 191.5px; width: 32px; height: 44px;
    transform-origin: center center; 
    will-change: transform;
}
#crown { left: 307px; top: 97px; width: 78px; height: 57px; z-index: 5; }

@keyframes wingFlapInLeft {
    0% { transform: scale(0.1) rotate(60deg); opacity: 0; }
    70% { transform: scale(1.15) rotate(-10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes wingFlapInRight {
    0% { transform: scale(0.1) rotate(-60deg); opacity: 0; }
    70% { transform: scale(1.15) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.wing-flap-left { animation: wingFlapInLeft 1s ease-out forwards; transform-origin: top right; }
.wing-flap-right { animation: wingFlapInRight 1s ease-out forwards; transform-origin: top left; }

.phase2-bob { animation: phase2BodyBob 3.9s ease-in-out infinite; }
.phase2-crown-bob { animation: phase2CrownBob 3.1s ease-in-out infinite; }
.phase2-hand-left-bob { animation: phase2HandLeftBob 2.8s ease-in-out infinite; }
.phase2-hand-right-bob { animation: phase2HandRightBob 3.3s ease-in-out infinite; }
.orb-hand-fast { transition: left .12s ease-out, top .12s ease-out, transform .12s ease-out !important; }
.final-hand-travel { transition: left .9s linear !important; }
.phase2-wing-left-bob { animation: phase2WingLeftBob 3.2s ease-in-out infinite; }
.phase2-wing-right-bob { animation: phase2WingRightBob 3.6s ease-in-out infinite; }
.phase2-back-left-bob { animation: phase2BackLeftBob 3.8s ease-in-out infinite; }
.phase2-back-right-bob { animation: phase2BackRightBob 4.3s ease-in-out infinite; }

.fast-wing-bob { animation-duration: 0.8s !important; }

@keyframes phase2BodyBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes phase2CrownBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes phase2HandLeftBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes phase2HandRightBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes phase2WingLeftBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes phase2WingRightBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes phase2BackLeftBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes phase2BackRightBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

#bg-canvas, #game-canvas {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
}
#bg-canvas { z-index: 110; }
#game-canvas { z-index: 130; }


/* Final ending cinematic */
#ending-fog {
    position: absolute;
    inset: 0;
    z-index: 390;
    pointer-events: none;
    opacity: 0;
    background:
        radial-gradient(circle at 50% 52%, rgba(40,40,40,.16) 0%, rgba(8,8,8,.72) 48%, rgba(0,0,0,.98) 100%),
        repeating-radial-gradient(ellipse at 50% 55%, rgba(80,80,80,.035) 0 18px, rgba(0,0,0,.04) 19px 42px);
    filter: blur(1px);
    transition: opacity 1.2s ease;
}
#ending-fog.active { opacity: 1; }
#ending-fade {
    position: absolute;
    inset: 0;
    z-index: 800;
    background: #000;
    opacity: 0;
    pointer-events: none;
}
#ending-fade.active { opacity: 1; }
.final-suck {
    transition: transform .1s linear !important;
}
.final-player-big .player-dot {
    width: 88px;
    height: 88px;
    box-shadow: 0 0 25px #fff, 0 0 55px rgba(255,255,255,.55);
}

.screen-shake { animation: screenShake .65s ease-out; }

@keyframes screenShake {
    0%   { transform: translate(0,0); }
    10%  { transform: translate(-10px,6px); }
    20%  { transform: translate(9px,-7px); }
    30%  { transform: translate(-8px,-5px); }
    40%  { transform: translate(8px,7px); }
    50%  { transform: translate(-6px,4px); }
    60%  { transform: translate(5px,-4px); }
    70%  { transform: translate(-3px,3px); }
    80%  { transform: translate(3px,-2px); }
    90%  { transform: translate(-1px,1px); }
    100% { transform: translate(0,0); }
}

.pause-overlay, .death-overlay, .win-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    pointer-events: none;
    opacity: 0;
    z-index: 400;
    transition: opacity .25s ease;
}

.pause-overlay { background: rgba(0,0,0,.75); backdrop-filter: blur(4px); }
.death-overlay { background: rgba(15,0,0,.85); backdrop-filter: blur(6px); }
.win-overlay { background: rgba(0,20,30,.85); backdrop-filter: blur(6px); }

.pause-overlay.active, .death-overlay.active, .win-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.pause-title {
    font-size: 48px;
    letter-spacing: 4px;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
    margin-bottom: 10px;
}

.pause-subtitle { font-size: 18px; color: #ffa0a0; letter-spacing: 1px; }

.death-title {
    font-size: 52px;
    color: #ff3333;
    letter-spacing: 4px;
    text-shadow: 0 0 25px #f00, 0 0 50px #900;
}

.win-title {
    font-size: 56px;
    color: #ff3333;
    letter-spacing: 5px;
    text-shadow: 0 0 25px #cc0000, 0 0 50px #ff0000;
}

.overlay-btn {
    margin-top: 25px;
    padding: 12px 32px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    border-radius: 20px;
    cursor: pointer;
    pointer-events: auto;
}

.death-btn {
    background: linear-gradient(135deg,#cc0000,#880000);
    border: 2px solid #ff4444;
    box-shadow: 0 0 15px rgba(255,0,0,.5);
}

.win-btn {
    background: linear-gradient(135deg,#cc0000,#660000);
    border: 2px solid #ff3333;
    box-shadow: 0 0 15px rgba(255,0,0,.5);
}

/* Mobile controls */
#mobile-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    z-index: 1000;
    border: 2px solid rgba(255,255,255,.65);
    border-radius: 6px;
    background: rgba(20,20,20,.75);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
}
#mobile-controls {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: none;
    pointer-events: none;
}
#mobile-controls.active { display: block; }
.mobile-joystick {
    position: absolute;
    width: 150px;
    height: 150px;
    border: 2px solid rgba(255,255,255,.32);
    border-radius: 50%;
    background: rgba(255,255,255,.06);
    pointer-events: auto;
    touch-action: none;
}
#move-joystick { left: 30px; bottom: 35px; }
#aim-joystick { right: 30px; bottom: 35px; }
.mobile-stick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    margin-left: -29px;
    margin-top: -29px;
    border-radius: 50%;
    background: rgba(255,255,255,.28);
    border: 2px solid rgba(255,255,255,.65);
    box-shadow: 0 0 12px rgba(255,255,255,.18);
    pointer-events: none;
}
</style>
</head>

<body>
<button id="mobile-toggle" aria-label="Toggle mobile mode">☰</button>
<div id="mobile-controls">
    <div class="mobile-joystick" id="move-joystick"><div class="mobile-stick"></div></div>
    <div class="mobile-joystick" id="aim-joystick"><div class="mobile-stick"></div></div>
</div>

<div class="boss-hp-container">
    <div class="boss-hp-bar">
        <div class="boss-hp-fill" id="boss-hp-fill"></div>
    </div>
    <div class="boss-hp-name">The Destroyer</div>
</div>

<div class="player-hp-container">
    <div class="player-hp-bar">
        <div class="player-hp-fill" id="player-hp-fill"></div>
    </div>
    <div class="player-hp-text" id="player-hp-text">HP: 75 / 75</div>
</div>

<div class="pause-overlay" id="pause-overlay">
    <div class="pause-title">PAUSED</div>
    <div class="pause-subtitle">Press [P] to Resume</div>
</div>

<div class="death-overlay" id="death-overlay">
    <div class="death-title">YOU DIED</div>
    <div class="pause-subtitle" id="death-message"></div>
    <button class="overlay-btn death-btn" onclick="restartGame()">RESPAWN</button>
</div>

<div class="win-overlay" id="win-overlay">
    <div class="win-title">VICTORY</div>
    <div class="pause-subtitle">The Destroyer has been destroyed, but at what cost..</div>
    <button class="overlay-btn win-btn" onclick="restartGame()">PLAY AGAIN</button>
</div>

<div id="ending-fog"></div>
<div id="ending-fade"></div>

<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<canvas id="bg-canvas"></canvas>

<div id="destroyer-scene-back" class="destroyer-layer">
    <img id="wingbackgroundleft" src="wingbackgroundleft.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'202\' height=\'217\' viewBox=\'0 0 202 217\'><path d=\'M180 180 Q100 20 10 120 Q90 190 180 180 Z\' fill=\'%23660000\' stroke=\'%23ff0000\' stroke-width=\'3\'/></svg>'" alt="">
    <img id="wingbackgroundright" src="wingbackgrounright.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'202\' height=\'217\' viewBox=\'0 0 202 217\'><path d=\'M22 180 Q102 20 192 120 Q112 190 22 180 Z\' fill=\'%23660000\' stroke=\'%23ff0000\' stroke-width=\'3\'/></svg>'" alt="">
    
    <img id="wingleft" src="wingleft.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'255\' height=\'144\' viewBox=\'0 0 255 144\'><path d=\'M230 70 Q120 0 10 70 Q120 140 230 70 Z\' fill=\'%23990000\' stroke=\'%23ff3333\' stroke-width=\'3\'/></svg>'" alt="">
    <img id="rwingright" src="rwingright.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'255\' height=\'144\' viewBox=\'0 0 255 144\'><path d=\'M25 70 Q135 0 245 70 Q135 140 25 70 Z\' fill=\'%23990000\' stroke=\'%23ff3333\' stroke-width=\'3\'/></svg>'" alt="">
    
    <div id="red-ball"></div>

    <img id="handleft" src="handleft.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'48\' viewBox=\'0 0 40 48\'><path d=\'M5 10 L35 10 L30 40 L10 40 Z\' fill=\'%23cc0000\' stroke=\'%23ff6666\' stroke-width=\'2\'/></svg>'" alt="">
    <img id="handright" src="handright.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'48\' viewBox=\'0 0 40 48\'><path d=\'M5 10 L35 10 L30 40 L10 40 Z\' fill=\'%23cc0000\' stroke=\'%23ff6666\' stroke-width=\'2\'/></svg>'" alt="">
    
    <img id="body2" src="body2.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'78\' height=\'75\' viewBox=\'0 0 78 75\'><ellipse cx=\'39\' cy=\'37\' rx=\'35\' ry=\'33\' fill=\'%23440000\' stroke=\'%23ff0000\' stroke-width=\'4\'/></svg>'" alt="The Destroyer">
</div>

<canvas id="game-canvas"></canvas>

<div id="destroyer-scene-front" class="destroyer-layer">
    <div id="pupil-container">
        <img id="pupil" src="pupil2.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'44\' viewBox=\'0 0 32 44\'><ellipse cx=\'16\' cy=\'22\' rx=\'14\' ry=\'20\' fill=\'%23ff0000\' stroke=\'%23ffffff\' stroke-width=\'3\'/></svg>'" alt="">
    </div>
    <img id="crown" src="crown.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'78\' height=\'57\' viewBox=\'0 0 78 57\'><polygon points=\'10,50 20,10 39,30 58,10 68,50\' fill=\'%23ff1a1a\' stroke=\'%23ffffff\' stroke-width=\'2\'/></svg>'" alt="">
</div>

<div class="player-container" id="player">
    <div class="player-dot" id="player-dot"></div>
    <div class="player-pointer" id="player-pointer">
        <div class="player-triangle"></div>
    </div>
</div>

<script>
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");

const bgCanvas = document.getElementById("bg-canvas");
const bgCtx = bgCanvas.getContext("2d");

const playerEl = document.getElementById("player");
const playerDot = document.getElementById("player-dot");
const playerPointer = document.getElementById("player-pointer");
const playerHpFill = document.getElementById("player-hp-fill");
const playerHpText = document.getElementById("player-hp-text");
const bossHpFill = document.getElementById("boss-hp-fill");
const pauseOverlay = document.getElementById("pause-overlay");
const deathOverlay = document.getElementById("death-overlay");
const winOverlay = document.getElementById("win-overlay");
const deathMessage = document.getElementById("death-message");
const bgMusic = document.getElementById("bg-music");

const sceneBack = document.getElementById("destroyer-scene-back");
const sceneFront = document.getElementById("destroyer-scene-front");

const body = document.getElementById("body2");
const pupil = document.getElementById("pupil");
const leftHand = document.getElementById("handleft");
const rightHand = document.getElementById("handright");
const crown = document.getElementById("crown");
const wingLeft = document.getElementById("wingleft");
const wingRight = document.getElementById("rwingright");
const backWingLeft = document.getElementById("wingbackgroundleft");
const backWingRight = document.getElementById("wingbackgroundright");
const redBall = document.getElementById("red-ball");
const playerHpContainer = document.querySelector(".player-hp-container");
const bossHpContainer = document.querySelector(".boss-hp-container");
const endingFog = document.getElementById("ending-fog");
const endingFade = document.getElementById("ending-fade");

let isPaused = false;
let pauseStartedAt = 0;
let pausedDuration = 0;
let isDead = false;
let isWon = false;
let isDying = false; 
let postFlyPhase = false;
let deathEyeTarget = null;
let flySkipTriggered = false;
let phase = 1;
let phaseTransitioning = false;
let phase2HpStart = 0;
let phase2HandAttackUnlocked = false;
let p2FlamethrowerUnlocked = false;

let p2CenterSpikeUnlocked = false;
let p2TransitionTriggered = false;
let inP2Transition = false;
let p2TransitionDamageDealt = 0;
let p2TransitionEnded = false;
let p2TransitionEndTime = 0;
let transitionNextFlameTime = 0;
let p2Enraged = false;
let p2EnragedStartTime = 0;
let nextEnragedBurstTime = 0;
let wallClosingActive = false;
let wallClosingStartTime = 0;
let wallCloseProgress = 0;
let wallCloseSpeed = 0.00011;
let wallHandGrabStarted = false;
let wallReleaseActive = false;
let wallReleaseStartTime = 0;
let wallReleaseProgress = 0;
let endingState = "NONE";
let endingStateStartTime = 0;
let endingControlsLocked = false;
let endingUiSuckStarted = false;
let endingPlayerSuckStarted = false;
let endingExplosionTriggered = false;
let endingFogStarted = false;
let endingDiagonalLines = false;
let endingFadeProgress = 0;
let floorSpikeHeight = 0;
let targetFloorSpikeHeight = 0;
let meteorSpeedMultiplier = 1.0;

const bgMeteorLines = [];
const NUM_METEOR_LINES = 45;

function initMeteorShower() {
    bgMeteorLines.length = 0;
    for (let i = 0; i < NUM_METEOR_LINES; i++) {
        bgMeteorLines.push({
            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            length: 25 + Math.random() * 45,
            speed: 0.8 + Math.random() * 1.2,
            alpha: 0.12 + Math.random() * 0.28,
            width: 1 + Math.random() * 1.5
        });
    }
}
initMeteorShower();

let mouseX = innerWidth / 2;
let mouseY = innerHeight / 2;
let isMouseDown = false;
let mobileMode = false;
let mobileAimDown = false;
let mobileAimX = 1;
let mobileAimY = 0;
const mobileMove = { x: 0, y: 0 };
const keys = { w:false, a:false, s:false, d:false, h:false, j:false, l:false };

const maxPlayerHp = 75;
let playerHp = maxPlayerHp;
let playerInvulnTime = 0;

function setMobileStick(joystick, clientX, clientY) {
    const rect = joystick.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const max = rect.width * 0.32;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > max) {
        dx = dx / dist * max;
        dy = dy / dist * max;
    }
    const stick = joystick.querySelector(".mobile-stick");
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    return { x: dx / max, y: dy / max };
}

function resetMobileStick(joystick) {
    joystick.querySelector(".mobile-stick").style.transform = "translate(0px, 0px)";
}

function setupMoveJoystick() {
    let activeId = null;
    moveJoystick.addEventListener("pointerdown", e => {
        if (!mobileMode) return;
        activeId = e.pointerId;
        moveJoystick.setPointerCapture(activeId);
        const v = setMobileStick(moveJoystick, e.clientX, e.clientY);
        mobileMove.x = v.x;
        mobileMove.y = v.y;
        e.preventDefault();
    });
    moveJoystick.addEventListener("pointermove", e => {
        if (e.pointerId !== activeId) return;
        const v = setMobileStick(moveJoystick, e.clientX, e.clientY);
        mobileMove.x = v.x;
        mobileMove.y = v.y;
        e.preventDefault();
    });
    const end = e => {
        if (e.pointerId !== activeId) return;
        activeId = null;
        mobileMove.x = 0;
        mobileMove.y = 0;
        resetMobileStick(moveJoystick);
    };
    moveJoystick.addEventListener("pointerup", end);
    moveJoystick.addEventListener("pointercancel", end);
}

function setupAimJoystick() {
    let activeId = null;
    aimJoystick.addEventListener("pointerdown", e => {
        if (!mobileMode) return;
        activeId = e.pointerId;
        aimJoystick.setPointerCapture(activeId);
        const v = setMobileStick(aimJoystick, e.clientX, e.clientY);
        if (Math.hypot(v.x, v.y) > 0.12) {
            mobileAimX = v.x;
            mobileAimY = v.y;
        }
        mobileAimDown = true;
        e.preventDefault();
    });
    aimJoystick.addEventListener("pointermove", e => {
        if (e.pointerId !== activeId) return;
        const v = setMobileStick(aimJoystick, e.clientX, e.clientY);
        if (Math.hypot(v.x, v.y) > 0.12) {
            const len = Math.hypot(v.x, v.y);
            mobileAimX = v.x / len;
            mobileAimY = v.y / len;
        }
        e.preventDefault();
    });
    const end = e => {
        if (e.pointerId !== activeId) return;
        activeId = null;
        mobileAimDown = false;
        resetMobileStick(aimJoystick);
    };
    aimJoystick.addEventListener("pointerup", end);
    aimJoystick.addEventListener("pointercancel", end);
}

function triggerP2Transition(time) {
    if (p2TransitionTriggered || phase !== 2 || isDying || postFlyPhase) return;

    p2TransitionTriggered = true;
    inP2Transition = true;
    p2TransitionDamageDealt = 0;
    bossState = "P2_TRANSITION";
    targetFloorSpikeHeight = 45;
    meteorSpeedMultiplier = 6.0;

    wingLeft.classList.add("fast-wing-bob");
    wingRight.classList.add("fast-wing-bob");
    backWingLeft.classList.add("fast-wing-bob");
    backWingRight.classList.add("fast-wing-bob");

    transitionNextFlameTime = time + 1200;
}

function checkPhase2SkipShortcut() {
    if (keys.h && keys.j && phase === 1 && !phaseTransitioning && !isDying && !postFlyPhase) {
        bossHp = Math.min(bossHp, maxBossHp * 0.66);
        updateBossHP();
        enterPhase2();
    }

    // H + L skips directly to the very-late flying/falling phase.
    // It depletes the boss HP all the way to the normal 100 HP trigger point.
    if (keys.h && keys.l && !flySkipTriggered && !isDying && !postFlyPhase) {
        flySkipTriggered = true;

        const startFlyingPhase = () => {
            if (phase === 1) {
                bossHp = Math.min(bossHp, maxBossHp * 0.66);
                updateBossHP();
                enterPhase2();
            }

            // H+L jumps directly to the new flying phase trigger.
            // Establish phase 2 first, then place the boss at exactly 90 HP
            // and start the same flying sequence used by the natural trigger.
            bossHp = 90;
            phase2HpStart = bossHp;
            updateBossHP();
            triggerP2Transition(performance.now());
        };

        if (phase === 1) {
            setTimeout(startFlyingPhase, 1200);
        } else {
            startFlyingPhase();
        }
    }
}


function getGameTime(realTime) {
    const activePauseTime = isPaused && pauseStartedAt > 0 ? realTime - pauseStartedAt : 0;
    return realTime - pausedDuration - activePauseTime;
}

window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if(keys.hasOwnProperty(k)) keys[k] = true;
    
    checkPhase2SkipShortcut();

    if(k === 'p' && !isDead && !isWon) {
        const now = performance.now();
        if (!isPaused) {
            isPaused = true;
            pauseStartedAt = now;
        } else {
            if (pauseStartedAt > 0) pausedDuration += now - pauseStartedAt;
            pauseStartedAt = 0;
            isPaused = false;
        }
        pauseOverlay.classList.toggle("active", isPaused);
    }
});

window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if(keys.hasOwnProperty(k)) keys[k] = false;
    if(k === "h" || k === "l") flySkipTriggered = false;
});

function getDestroyerScale() {
    return (innerWidth / 704) * 0.82;

function getPhase2CenterPosition() {
    const scale = getDestroyerScale();
    const bodyCenterLocalX = 305 + 78 / 2;
    const transformOriginX = 704 / 2;
    const targetBodyCenterX = innerWidth / 2;
    const targetBodyCenterY = innerHeight * 0.28;
    const bodyCenterLocalY = 176 + 75 / 2;
    return {
        x: targetBodyCenterX - transformOriginX - (bodyCenterLocalX - transformOriginX) * scale,
        y: targetBodyCenterY - bodyCenterLocalY * scale
    };
}

function spawnTransformationExplosion(lx, ly, intensity = 130, colorMode = "red") {
    const scale = getDestroyerScale();
    const globalX = destroyerX + 352 + (lx - 352) * scale;
    const globalY = destroyerY + ly * scale;

    for (let i = 0; i < intensity; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 8;
        
        let color = Math.random() > 0.5 ? '#ff0033' : '#cc0000';
        if(colorMode === "dark") color = Math.random() > 0.5 ? '#440000' : '#110000';
        
        particles.push({
            x: globalX, y: globalY,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            alpha: 1, decay: .012 + Math.random() * .018,
            size: 2 + Math.random() * 5, color: color
        });
    }
}

let deathStep = 0;
let nextDeathTime = 0;
let deathCutsceneFinished = false;
const deathSequence = [
    { el: backWingLeft, lx: 79 + 101, ly: 17 + 108 },
    { el: backWingRight, lx: 399 + 101, ly: 17 + 108 },
    { el: wingLeft, lx: 28 + 127, ly: 122 + 72 },
    { el: wingRight, lx: 399 + 127, ly: 122 + 72 },

function startDeathCutscene() {
    if (isDying || postFlyPhase) return;
    // Keep the hands untouched through the breaking phase. They are sent
    // off-screen when the final spike walls begin closing.
    wallClosingActive = false;
    wallReleaseActive = false;
    wallClosingStartTime = 0;
    wallCloseProgress = 0;
    wallHandGrabStarted = false;
    isDying = true;
    deathCutsceneFinished = false;
    deathEyeTarget = null;
    deathStep = 0;
    nextDeathTime = performance.now() + 1000;
    
    playerBullets.length = 0;
    bossProjectiles.length = 0;
    bgProjectiles.length = 0;
    
    redBall.className = "";
    bossState = "IDLE";
}

function processDeathCutscene(time) {
    if (!isDying) return;
    
    if (time > nextDeathTime && deathStep < deathSequence.length) {
        let stage = deathSequence[deathStep];
        deathEyeTarget = stage.el;
        spawnTransformationExplosion(stage.lx, stage.ly, 50, "dark");
        
        stage.el.className = "";
        stage.el.style.filter = "brightness(0.5) contrast(1.1)";
        stage.el.style.transform = "rotate(-20deg)";
        
        setTimeout(() => {
            if (!isDying) return;
            fallingParts.push({
                el: stage.el,
                y: parseFloat(stage.el.style.top) || 0,
                x: parseFloat(stage.el.style.left) || 0,
                vy: -3, vr: (Math.random() - 0.5) * 8, rot: -20
            });
            deathEyeTarget = stage.el;
        }, 300);

        deathStep++;
        nextDeathTime = time + 1400; 
    } 
    else if (time > nextDeathTime && deathStep === deathSequence.length) {
        spawnTransformationExplosion(305 + 39, 176 + 37, 80, "dark"); 
        
        document.body.classList.remove("screen-shake");
        void document.body.offsetWidth;
        document.body.classList.add("screen-shake");
        
        deathStep++;
        nextDeathTime = time + 2500; 
    }
    else if (time > nextDeathTime && deathStep > deathSequence.length && fallingParts.length === 0 && !wallClosingActive) {
        // The wings/body have finished falling. Briefly restore the normal hand pose,
        // then begin the final wall-closing sequence instead of winning immediately.
        wallClosingActive = true;
        wallReleaseActive = false;
        deathEyeTarget = null;
        wallClosingStartTime = time;
        wallCloseProgress = 0;
        wallHandGrabStarted = false;
        nextDeathTime = time + 500;
    }
}

function updateWallClosingPhase(time) {
    if (!wallClosingActive) return;

    const elapsed = time - wallClosingStartTime;

    // Deliberately slow final wall closing: the player gets more time to finish the boss.
    wallCloseProgress = Math.min(1, Math.max(0, (elapsed - 350) / 5200));

    // The red walls close in from both sides. The first small spikes appear immediately.
    const wallWidth = 24 + wallCloseProgress * (innerWidth * 0.46);

    // During the final phase the hands leave the screen and stay there.
    // They do not follow the wall edges or return until the boss is killed.
    if (elapsed >= 350 && !wallReleaseActive) {
        wallHandGrabStarted = true;
        // Both hands travel horizontally in perfectly straight, opposite directions.
        // Keep the same Y coordinate and clear any previous attack rotation.
        leftHand.classList.add("final-hand-travel");
        rightHand.classList.add("final-hand-travel");
        leftHand.style.transform = "";
        rightHand.style.transform = "";
        leftHand.style.top = "263px";
        rightHand.style.top = "263px";
        // Hands live inside the 704px boss scene, so move them past the
        // scene edges rather than using viewport coordinates.
        leftHand.style.left = "-90px";
        rightHand.style.left = "754px";
    }
    const spikeCount = 10;
    if (!wallReleaseActive) {
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = "#800000";
        ctx.strokeStyle = "#ff3333";
        ctx.lineWidth = 3;
        ctx.fillRect(0, 0, wallWidth, innerHeight);
        ctx.strokeRect(0, 0, wallWidth, innerHeight);
        ctx.fillRect(innerWidth - wallWidth, 0, wallWidth, innerHeight);
        ctx.strokeRect(innerWidth - wallWidth, 0, wallWidth, innerHeight);

        ctx.fillStyle = "#ff3333";
        for (let i = 0; i < spikeCount; i++) {
            const y = (i + 0.5) * innerHeight / spikeCount;
            const spikeDepth = 28 + wallCloseProgress * 35;

            ctx.beginPath();
            ctx.moveTo(wallWidth, y - 13);
            ctx.lineTo(wallWidth + spikeDepth, y);
            ctx.lineTo(wallWidth, y + 13);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(innerWidth - wallWidth, y - 13);
            ctx.lineTo(innerWidth - wallWidth - spikeDepth, y);
            ctx.lineTo(innerWidth - wallWidth, y + 13);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }
    // Being caught by the closing walls damages the player heavily, but the boss
    // remains vulnerable throughout the sequence.
    const spikeDepth = 28 + wallCloseProgress * 35;
    const safeLeft = wallWidth + spikeDepth + 2;
    const safeRight = innerWidth - wallWidth - spikeDepth - 2;
    if (!isDead && !isWon && (playerX < safeLeft || playerX > safeRight)) {
        damagePlayer(15, time);
    }

    if (wallCloseProgress >= 1) {
        // Keep the walls closed and give the player a final window to finish the boss.
        wallCloseProgress = 1;
    }

    // Once the boss reaches 0 HP, rapidly retract the spike walls and then
    // remove them completely. Only after that do the hands return home.
    if (bossHp <= 0 && !wallReleaseActive) {
        wallReleaseActive = true;
        wallReleaseStartTime = time;
        endingState = "BOSS_EXPLOSION_WAIT";
        endingStateStartTime = time;
        bossHp = 0;
        updateBossHP();
    }

    if (wallReleaseActive) {
        // Fast outward release: the spike walls physically travel off-screen
        // instead of simply shrinking away.
        const releaseProgress = Math.min(1, (time - wallReleaseStartTime) / 520);
        wallReleaseProgress = releaseProgress;
        wallCloseProgress = 1;

        const retreatDistance = releaseProgress * (innerWidth * 1.25);
        const releaseWallWidth = 24 + innerWidth * 0.46;
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#800000";
        ctx.strokeStyle = "#ff3333";
        ctx.lineWidth = 3;
        // Re-use the exact walls already on screen and translate those same
        // walls outward. This prevents a second set of walls from appearing.
        const leftWallX = -retreatDistance;
        const rightWallX = innerWidth - releaseWallWidth + retreatDistance;
        ctx.fillRect(leftWallX, 0, releaseWallWidth, innerHeight);
        ctx.strokeRect(leftWallX, 0, releaseWallWidth, innerHeight);
        ctx.fillRect(rightWallX, 0, releaseWallWidth, innerHeight);
        ctx.strokeRect(rightWallX, 0, releaseWallWidth, innerHeight);
        ctx.fillStyle = "#ff3333";
        for (let i = 0; i < spikeCount; i++) {
            const y = (i + 0.5) * innerHeight / spikeCount;
            const spikeDepth = 60;
            ctx.beginPath();
            ctx.moveTo(leftWallX + releaseWallWidth, y - 13);
            ctx.lineTo(leftWallX + releaseWallWidth + spikeDepth, y);
            ctx.lineTo(leftWallX + releaseWallWidth, y + 13);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(rightWallX, y - 13);
            ctx.lineTo(rightWallX - spikeDepth, y);
            ctx.lineTo(rightWallX, y + 13);
            ctx.closePath(); ctx.fill();
        }
        ctx.restore();

        if (releaseProgress >= 1) {
            wallClosingActive = false;
            wallReleaseActive = false;
            wallCloseProgress = 0;
            wallHandGrabStarted = false;
            resetHandsToNormal();
            setTimeout(() => {
                leftHand.classList.remove("final-hand-travel");
                rightHand.classList.remove("final-hand-travel");
            }, 950);
            finishDeathCutscene();
        }
    }
}

function finishDeathCutscene() {
    if (deathCutsceneFinished) return;
    deathCutsceneFinished = true;
    isDying = false;
    postFlyPhase = true;
    deathEyeTarget = null;
    fallingParts.length = 0;
    resetPhaseVisuals();
    resetHandsToNormal();
    bossState = "POST_FLY";
    nextAttackTime = Infinity;
    pupilPulseScale = 1;
    currentEyeX = 0;
    currentEyeY = 0;

    // The hands/walls are finished first. One second later the actual boss
    // explosion begins, which starts the longer end-of-game cinematic.
    if (!endingExplosionTriggered) {
        endingState = "BOSS_EXPLOSION_WAIT";
        if (!endingStateStartTime) endingStateStartTime = performance.now();
    }
    endingControlsLocked = true;
    endingExplosionTriggered = false;
}

function beginEndingExplosion(time) {
    if (endingExplosionTriggered) return;
    endingExplosionTriggered = true;
    endingState = "EXPLOSION";
    endingStateStartTime = time;
    spawnTransformationExplosion(344, 213, 520, "red");
    spawnTransformationExplosion(344, 213, 280, "dark");
    document.body.classList.remove("screen-shake");
    void document.body.offsetWidth;
    document.body.classList.add("screen-shake");
    sceneBack.style.display = "none";
    sceneFront.style.display = "none";
    floorSpikeHeight = 0;
    targetFloorSpikeHeight = 0;
    bossHp = 0;
    updateBossHP();
}

function processEndingCinematic(time) {
    if (endingState === "NONE") return;

    if (endingState === "BOSS_EXPLOSION_WAIT") {
        if (time - endingStateStartTime >= 1000) beginEndingExplosion(time);
        return;
    }

    if (endingState === "EXPLOSION") {
        // Give the explosion a few seconds to play before the player loses control.
        if (time - endingStateStartTime >= 4000) {
            endingState = "SUCTION_PREP";
            endingStateStartTime = time;
            endingControlsLocked = true;
            endingDiagonalLines = true;
            endingUiSuckStarted = false;
            endingPlayerSuckStarted = false;
        }
        return;
    }

    if (endingState === "SUCTION_PREP") {
        // Very slow downward pull while the background accelerates down-right.
        playerY = Math.min(innerHeight - 20, playerY + 0.18);
        // UI begins shaking toward down-right before the actual suction.
        const shakeT = Math.min(1, (time - endingStateStartTime) / 900);
        const shakeX = (3 + shakeT * 8) * Math.sin(time * 0.045);
        const shakeY = (3 + shakeT * 8) * Math.sin(time * 0.052);
        const shakeRot = (1 + shakeT * 3) * Math.sin(time * 0.06);
        playerHpContainer.style.transform = `translate(${shakeX}px, ${shakeY}px) rotate(${shakeRot}deg)`;
        bossHpContainer.style.transform = `translate(calc(-50% + ${shakeX}px), ${shakeY}px) rotate(${shakeRot}deg)`;
        if (time - endingStateStartTime >= 1300) {
            endingState = "UI_SUCK";
            endingStateStartTime = time;
            endingUiSuckStarted = true;
        }
        return;
    }

    if (endingState === "UI_SUCK") {
        const t = Math.min(1, (time - endingStateStartTime) / 1500);
        const distance = 2200 * t * t;
        const spin = 1080 * t;
        const tr = `translate(${distance}px, ${distance}px) rotate(${spin}deg)`;
        playerHpContainer.style.transform = tr;
        bossHpContainer.style.transform = `translate(calc(-50% + ${distance}px), ${distance}px) rotate(${spin}deg)`;
        playerHpContainer.classList.add("final-suck");
        bossHpContainer.classList.add("final-suck");
        if (t >= 1) {
            playerHpContainer.style.opacity = "0";
            bossHpContainer.style.opacity = "0";
            endingState = "PLAYER_SUCK";
            endingStateStartTime = time;
            endingPlayerSuckStarted = true;
        }
        return;
    }

    if (endingState === "PLAYER_SUCK") {
        const t = Math.min(1, (time - endingStateStartTime) / 1100);
        const distance = 2600 * t * t;
        const spin = 1440 * t;
        playerEl.classList.remove("final-player-big");
        playerEl.style.transform = `translate(${playerX + distance}px, ${playerY + distance}px) rotate(${spin}deg)`;
        playerEl.style.opacity = String(1 - t * .15);
        if (t >= 1) {
            playerEl.style.opacity = "0";
            endingState = "FADE_TO_BLACK";
            endingStateStartTime = time;
            endingFadeProgress = 0;
        }
        return;
    }

    if (endingState === "FADE_TO_BLACK") {
        const t = Math.min(1, (time - endingStateStartTime) / 1400);
        endingFade.style.opacity = String(t);
        if (t >= 1) {
            endingState = "BLACK_HOLD";
            endingStateStartTime = time;
            endingFade.style.opacity = "1";
            endingFog.classList.add("active");
            sceneBack.style.display = "none";
            sceneFront.style.display = "none";
            canvas.style.display = "none";
            bgCanvas.style.display = "none";
            playerHpContainer.style.display = "none";
            bossHpContainer.style.display = "none";
            playerEl.classList.add("final-player-big");
            playerEl.style.opacity = "1";
            playerEl.style.transform = `translate(${innerWidth/2}px, ${innerHeight/2}px)`;
        }
        return;
    }

    if (endingState === "BLACK_HOLD") {
        // Hold on pure black for a few seconds before revealing the fog room.
        endingFade.style.opacity = "1";
        if (time - endingStateStartTime >= 2800) {
            endingState = "FOG_ROOM";
            endingStateStartTime = time;
            endingFogStarted = true;
            endingFade.style.transition = "opacity 2.2s ease-in-out";
            endingFade.style.opacity = "0";
        }
        return;
    }

    if (endingState === "FOG_ROOM") {
        // Movement is allowed in the fog room, but shooting remains disabled.
        // The player keeps the enlarged visual and the shooting triangle, but
        // the firing code is locked by endingControlsLocked.
        if (time - endingStateStartTime >= 6200) {
            endingState = "WIN";
            triggerWin();
        }
    }
}

function damagePlayer(amount, time) {
    if (isDying || isWon || isDead || time < playerInvulnTime) return;
    
    playerHp -= amount;
    playerInvulnTime = time + 500;
    
    playerDot.classList.add("hurt");
    setTimeout(() => { playerDot.classList.remove("hurt"); }, 200);
    
    updatePlayerHP();
    if (playerHp <= 0) triggerDeath("you got destroyed");
}

function spawnEdgeSpikeWave(time) {
    const numSpikes = 8 + Math.floor(Math.random() * 6);
    const diagAngles = [
        0, Math.PI / 2, Math.PI, Math.PI * 1.5,
        Math.PI / 4, Math.PI * 3 / 4, Math.PI * 5 / 4, Math.PI * 7 / 4
    ];

    for (let i = 0; i < numSpikes; i++) {
        const isDiagonal = Math.random() < 0.6;
        let angle, startX, startY;

        if (isDiagonal) {
            const baseAngle = diagAngles[4 + Math.floor(Math.random() * 4)];
            angle = baseAngle + (Math.random() - 0.5) * 0.35;

            if (Math.cos(angle) > 0) startX = -60;
            else startX = innerWidth + 60;
            if (Math.sin(angle) > 0) startY = -60;
            else startY = innerHeight + 60;

            if (Math.random() < 0.5) startX = Math.random() * innerWidth;
            else startY = Math.random() * innerHeight;
        } else {
            const edge = ["top", "bottom", "left", "right"][Math.floor(Math.random() * 4)];
            if (edge === "top") {
                startX = Math.random() * innerWidth;
                startY = -60;
                angle = Math.PI / 2 + (Math.random() - 0.5) * 0.4;
            } else if (edge === "bottom") {
                startX = Math.random() * innerWidth;
                startY = innerHeight + 60;
                angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.4;
            } else if (edge === "left") {
                startX = -60;
                startY = Math.random() * innerHeight;
                angle = 0 + (Math.random() - 0.5) * 0.4;
            } else {
                startX = innerWidth + 60;
                startY = Math.random() * innerHeight;
                angle = Math.PI + (Math.random() - 0.5) * 0.4;
            }
        }
        
        bossProjectiles.push({
            type: "edge_spike",
            x: startX,
            y: startY,
            angle: angle,
            width: 32,
            length: Math.hypot(innerWidth, innerHeight) * 1.25,
            triggerTime: time + 700 + Math.random() * 400,
            endTime: time + 1600,
            state: "warning"
        });
    }
}

function gameLoop(time) {
    requestAnimationFrame(gameLoop);
    if (isPaused || isDead || isWon) return;
    time = getGameTime(time);

    checkPhase2SkipShortcut();

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    const scale = getDestroyerScale();

    bgCtx.save();
    bgCtx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    bgCtx.lineCap = "round";
    for (let i = 0; i < bgMeteorLines.length; i++) {
        let line = bgMeteorLines[i];
        if (endingDiagonalLines) {
            const speed = 10 + line.speed * 7;
            line.x += speed;
            line.y += speed;
            if (line.x - line.length > innerWidth || line.y - line.length > innerHeight) {
                line.x = -Math.random() * 300;
                line.y = -Math.random() * 300;
            }
        } else {
            line.y -= line.speed * meteorSpeedMultiplier;
            if (line.y + line.length < 0) {
                line.y = innerHeight + Math.random() * 40;
                line.x = Math.random() * innerWidth;
            }
        }

        bgCtx.lineWidth = line.width;
        bgCtx.strokeStyle = `rgba(255, 255, 255, ${line.alpha})`;
        bgCtx.beginPath();
        if (endingDiagonalLines) {
            bgCtx.moveTo(line.x, line.y);
            bgCtx.lineTo(line.x - line.length * .75, line.y - line.length * .75);
        } else {
            bgCtx.moveTo(line.x, line.y);
            bgCtx.lineTo(line.x, line.y + line.length);
        }
        bgCtx.stroke();
    }
    bgCtx.restore();

    if (inP2Transition && !isDying && !endingControlsLocked) {
        playerY = Math.min(innerHeight - 20, playerY + 2.6);
    }

    // Normal controls remain active in the fog room, but are disabled during
    // the suction/death portion of the ending.
    if (!endingControlsLocked || endingState === "FOG_ROOM") {
        if (mobileMode) {
            playerX += mobileMove.x * playerSpeed;
            playerY += mobileMove.y * playerSpeed;
            playerX = Math.max(20, Math.min(innerWidth - 20, playerX));
            playerY = Math.max(20, Math.min(innerHeight - 20, playerY));
        } else {
            if (keys.w && playerY > 20) playerY -= playerSpeed;
            if (keys.s && playerY < innerHeight - 20) playerY += playerSpeed;
            if (keys.a && playerX > 20) playerX -= playerSpeed;
            if (keys.d && playerX < innerWidth - 20) playerX += playerSpeed;
        }
    }

    playerEl.style.transform = `translate(${playerX}px, ${playerY}px)`;
    
    let angleToMouse;
    if (mobileMode && mobileAimDown) {
        angleToMouse = Math.atan2(mobileAimY, mobileAimX);
    } else if (mobileMode) {
        angleToMouse = Math.atan2(mobileAimY, mobileAimX);
    } else {
        angleToMouse = Math.atan2(mouseY - playerY, mouseX - playerX);
    }
    playerPointer.style.transform = `rotate(${angleToMouse}rad)`;

    const mobileShoot = mobileMode && mobileAimDown;
    if ((isMouseDown || mobileShoot) && !endingControlsLocked && (!isDying || wallClosingActive) && time > lastShootTime + shootInterval) {
        playerBullets.push({
            x: playerX, y: playerY,
            vx: Math.cos(angleToMouse) * 15,
            vy: Math.sin(angleToMouse) * 15
        });
        lastShootTime = time;
    }

    positionDestroyerAtCenter();

    if (!isDying && phase === 1) {
        if (bossState === "IDLE") {
            destroyerX += (bossBaseX - destroyerX) * 0.05;
            destroyerY += (bossBaseY - destroyerY) * 0.05;

            if (!hasDoneSpikeAttack && bossHp <= 1900) {
                hasDoneSpikeAttack = true;
                bossState = "ATTACK4_LEAVE";
                bossTargetY = -1200;
            }
            else if (time > nextAttackTime) {
                let possibleAttacks = [1, 2];
                if (bossHp <= 1800) {
                    possibleAttacks.push(3, 5);
                }
                
                if (possibleAttacks.length > 1) {
                    possibleAttacks = possibleAttacks.filter(a => a !== lastAttackType);
                }
                
                const chosen = possibleAttacks[Math.floor(Math.random() * possibleAttacks.length)];
                lastAttackType = chosen;

                if (chosen === 1) {
                    bossState = "ATTACK1_MOVE";
                    const bossHalfWidth = 352 * scale;
                    const minX = 100 - bossHalfWidth;
                    const maxX = innerWidth - 100 - bossHalfWidth; 
                    bossTargetX = Math.max(minX, Math.min(maxX, playerX - bossHalfWidth)); 
                    
                    const minY = -50;
                    const maxY = innerHeight * 0.4;
                    bossTargetY = Math.max(minY, Math.min(maxY, playerY - 450 * scale));
                } else if (chosen === 2) {
                    bossState = "ATTACK2_PREP";
                    stateTimer = time + 1000;
                    
                    if (bossHp <= 1500 && Math.random() < 0.5) {
                        orbAttackVariant = "ROTATING_STREAMS";
                        orbStreamAngle = Math.random() * Math.PI * 2;
                    } else {
                        orbAttackVariant = "SCATTER";
                    }

                    leftHand.classList.add("orb-hand-fast");
                    rightHand.classList.add("orb-hand-fast");
                    leftHand.style.left = "210px";
                    leftHand.style.top = "210px";
                    leftHand.style.transform = "rotate(-40deg) scaleY(-1)";
                    
                    rightHand.style.left = "438px";
                    rightHand.style.top = "210px";
                    rightHand.style.transform = "rotate(40deg) scaleY(-1)";
                } else if (chosen === 3) {
                    bossState = "ATTACK3_MOVE_DOWN";
                    const bodyCenterLocalX = 344;
                    const transformOriginX = 352;
                    const bodyCenterLocalY = 213.5;
                    const targetX = innerWidth / 2;
                    const targetY = innerHeight / 2;
                    
                    bossTargetX = targetX - transformOriginX - (bodyCenterLocalX - transformOriginX) * scale;
                    bossTargetY = targetY - bodyCenterLocalY * scale;
                } else if (chosen === 5) {
                    bossState = "ATTACK5_PREP";
                    stateTimer = time + 600;
                    pupilPulseScale = 1.8;
                }
            }
        } 
        else if (bossState === "ATTACK1_MOVE") {
            destroyerX += (bossTargetX - destroyerX) * 0.06;
            destroyerY += (bossTargetY - destroyerY) * 0.06;
            
            if (Math.hypot(bossTargetX - destroyerX, bossTargetY - destroyerY) < 10) {
                bossState = "ATTACK1_SHOOT";
                pupilPulseScale = 1.6;
                
                const eyeGlobalX = destroyerX + 352 + (344 - 352) * scale;
                const eyeGlobalY = destroyerY + 223 * scale;
                const baseAngle = Math.atan2(playerY - eyeGlobalY, playerX - eyeGlobalX);
                
                for(let i = 0; i < 10; i++) {
                    const angleOffset = (i - 4.5) * 0.15;
                    const finalAngle = baseAngle + angleOffset;
                    
                    bossProjectiles.push({
                        type: "boomerang",
                        x: eyeGlobalX, y: eyeGlobalY,
                        vx: Math.cos(finalAngle) * 8,
                        vy: Math.sin(finalAngle) * 8,
                        rot: 0,
                        state: "outward",
                        returnTime: time + 600 + Math.random() * 1200,
                        hitRadius: 15
                    });
                }
                
                stateTimer = time + 1000;
            }
        }
        else if (bossState === "ATTACK1_SHOOT") {
            if (time > stateTimer) {
                bossState = "ATTACK1_RETURN";
            }
        }
        else if (bossState === "ATTACK1_RETURN") {
            destroyerX += (bossBaseX - destroyerX) * 0.04;
            destroyerY += (bossBaseY - destroyerY) * 0.04;
            
            if (Math.hypot(bossBaseX - destroyerX, bossBaseY - destroyerY) < 5) {
                bossState = "IDLE";
                nextAttackTime = time + 2000;
            }
        }
        else if (bossState === "ATTACK2_PREP") {
            if (time > stateTimer) {
                redBall.classList.add("active");
                bossState = "ATTACK2_GROW";
                stateTimer = time + 1000;
            }
        }
        else if (bossState === "ATTACK2_GROW") {
            if (time > stateTimer) {
                redBall.classList.add("pulsing");
                bossState = "ATTACK2_SHOOT";
                stateTimer = time + 5500;
                bossLastShootTime = time; 
            }
        }
        else if (bossState === "ATTACK2_SHOOT") {
            const ballGlobalX = destroyerX + 352 + (344 - 352) * scale;
            const ballGlobalY = destroyerY + 318 * scale;

            if (orbAttackVariant === "ROTATING_STREAMS") {
                if (time > bossLastShootTime + 60) {
                    orbStreamAngle += 0.18;
                    for (let s = 0; s < 6; s++) {
                        const streamAngle = orbStreamAngle + (s * Math.PI * 2 / 6);
                        bossProjectiles.push({
                            type: "ball_bullet",
                            x: ballGlobalX, y: ballGlobalY,
                            vx: Math.cos(streamAngle) * 6,
                            vy: Math.sin(streamAngle) * 6,
                            hitRadius: 6
                        });
                    }
                    bossLastShootTime = time;
                }
            } else {
                if (time > bossLastShootTime + 80) {
                    const numBullets = 14; 
                    for(let i=0; i<numBullets; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 2.5 + Math.random() * 6.5;
                        
                        bossProjectiles.push({
                            type: "ball_bullet",
                            x: ballGlobalX, y: ballGlobalY,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            hitRadius: 6
                        });
                    }
                    bossLastShootTime = time;
                }
            }
            
            if (time > stateTimer) {
                bossState = "ATTACK2_END";
                redBall.classList.remove("active");
                redBall.classList.remove("pulsing");
                
                leftHand.style.transform = "";
                rightHand.style.transform = "";
                leftHand.classList.remove("orb-hand-fast");
                rightHand.classList.remove("orb-hand-fast");
                leftHand.style.left = "293px";
                leftHand.style.top = "263px";
                rightHand.style.left = "355px";
                rightHand.style.top = "263px";
                
                stateTimer = time + 1000;
            }
        }
        else if (bossState === "ATTACK2_END") {
            if (time > stateTimer) {
                bossState = "IDLE";
                nextAttackTime = time + 2000;
            }
        }
        else if (bossState === "ATTACK3_MOVE_DOWN") {
            destroyerX += (bossTargetX - destroyerX) * 0.05;
            destroyerY += (bossTargetY - destroyerY) * 0.05;
            
            if (Math.hypot(bossTargetX - destroyerX, bossTargetY - destroyerY) < 10) {
                bossState = "ATTACK3_PULSATE";
                pupilPulseScale = 2.0;
                stateTimer = time + 600;
            }
        }
        else if (bossState === "ATTACK3_PULSATE") {
            if (time > stateTimer) {
                bossState = "ATTACK3_RETURN";
                spiralActive = true;
                spiralEndTime = time + 6500;
                spiralNextSpawnTime = time;
                spiralAngle = 0;
                spiralCenterX = destroyerX + 352 + (344 - 352) * scale;
                spiralCenterY = destroyerY + 213.5 * scale;
            }
        }
        else if (bossState === "ATTACK3_RETURN") {
            destroyerX += (bossBaseX - destroyerX) * 0.04;
            destroyerY += (bossBaseY - destroyerY) * 0.04;
            
            if (Math.hypot(bossBaseX - destroyerX, bossBaseY - destroyerY) < 15) {
                bossState = "IDLE";
                nextAttackTime = time + 1000;
            }
        }
        else if (bossState === "ATTACK5_PREP") {
            if (time > stateTimer) {
                bossState = "IDLE";
                nextAttackTime = time + 1500;
                
                for (let i = 0; i < 14; i++) {
                    bossProjectiles.push({
                        type: "orbit_spike",
                        angle: (Math.PI * 2 / 14) * i,
                        dist: 0,
                        maxDist: 140,
                        shootTime: time + 2500 + Math.random() * 1500,
                        vx: 0, vy: 0,
                        rot: 0,
                        lastTrailTime: 0
                    });
                }
            }
        }
        else if (bossState === "ATTACK4_LEAVE") {
            destroyerY += (bossTargetY - destroyerY) * 0.05;
            if (destroyerY < -800 && spikeWaveCount === 0) {
                bossState = "ATTACK4_SPIKES";
                spikeWaveCount = 3;
                stateTimer = time;
            }
        }
        else if (bossState === "ATTACK4_SPIKES") {
            if (spikeWaveCount > 0 && time > stateTimer) {
                spawnEdgeSpikeWave(time);
                spikeWaveCount--;
                stateTimer = time + 1800;
            } else if (spikeWaveCount === 0 && time > stateTimer) {
                bossState = "ATTACK4_RETURN";
            }
        }
        else if (bossState === "ATTACK4_RETURN") {
            destroyerX += (bossBaseX - destroyerX) * 0.05;
            destroyerY += (bossBaseY - destroyerY) * 0.05;
            if (Math.hypot(bossBaseX - destroyerX, bossBaseY - destroyerY) < 10) {
                bossState = "IDLE";
                nextAttackTime = time + 1500;
            }
        }
    }

    if (!isDying && phase === 1 && bossHp <= 1600 && bossState !== "ATTACK2_PREP" && bossState !== "ATTACK2_GROW" && bossState !== "ATTACK2_SHOOT") {
        if (!handSlamActive && time > nextHandSlamTime) {
            handSlamActive = true;
            handSlamPhase = "TOUCH";
            handSlamTimer = time + 300;
            
            leftHand.style.left = "304px";
            leftHand.style.top = "263px";
            leftHand.style.transform = "rotate(15deg)";
            
            rightHand.style.left = "344px";
            rightHand.style.top = "263px";
            rightHand.style.transform = "rotate(-15deg)";

        else if (handSlamActive) {
            if (handSlamPhase === "TOUCH" && time > handSlamTimer) {

                rightHand.style.top = "370px";

            else if (handSlamPhase === "SLAM" && time > handSlamTimer) {

                const slamX = destroyerX + 352 + (344 - 352) * scale;
                const slamY = destroyerY + 370 * scale;
                
                const randomAngleOffset = Math.random() * Math.PI * 2;

                    bossProjectiles.push({

                        angle: angle,

                    });

                leftHand.style.top = "263px";
                leftHand.style.transform = "";
                
                rightHand.style.left = "355px";
                rightHand.style.top = "263px";
                rightHand.style.transform = "";

                nextHandSlamTime = time + 2200 + Math.random() * 1800;

    }

    if (!isDying && phase === 2 && !postFlyPhase) {
        const p2DmgDealt = phase2HpStart - bossHp;

        if (!phase2HandAttackUnlocked && p2DmgDealt >= 100) {
            phase2HandAttackUnlocked = true;
        }
        if (!p2StarAttackUnlocked && p2DmgDealt >= 300) {
            p2StarAttackUnlocked = true;

        }
        if (!p2FeatherAttackUnlocked && p2DmgDealt >= 300) {

        }
        if (!p2OverlapUnlocked && p2DmgDealt >= 700) {

        if (!p2FlamethrowerUnlocked && p2DmgDealt >= 500) {

        }
        if (!p2CenterSpikeUnlocked && p2DmgDealt >= 550) {
            p2CenterSpikeUnlocked = true;
        }

        if (!p2Enraged && bossHp <= 500) {
            p2Enraged = true;
            p2EnragedStartTime = time;
            nextEnragedBurstTime = time + 500;

        }

        // The flying/falling phase begins when the boss reaches 90 HP.
        if (!p2TransitionTriggered && bossHp <= 90) {
            // Snap the threshold so the phase always begins at exactly 90 HP.
            bossHp = 90;
            updateBossHP();
            triggerP2Transition(time);
        }

        if (inP2Transition) {
            if (time > transitionNextFlameTime) {
                const chestX = destroyerX + 352 + (344 - 352) * scale;
                const chestY = destroyerY + 235 * scale;
                const angleToP = Math.atan2(playerY - chestY, playerX - chestX);

                bossProjectiles.push({
                    type: "flame_circle",
                    x: chestX,
                    y: chestY,
                    vx: Math.cos(angleToP) * 7.5,
                    vy: Math.sin(angleToP) * 7.5,
                    radius: 10,

                    growRate: 0.85,

                    color: "#ff3300",
                    hitRadius: 10
                });

                transitionNextFlameTime = time + 2500;

            // Keep the flying phase active until the boss reaches exactly 20 HP.
            if (bossHp <= 20) {
                bossHp = 20;
                updateBossHP();
                inP2Transition = false;
                p2TransitionEnded = true;
                p2TransitionEndTime = time;

                targetFloorSpikeHeight = 0;
                meteorSpeedMultiplier = 1.0;

                wingLeft.classList.remove("fast-wing-bob");
                wingRight.classList.remove("fast-wing-bob");
                backWingLeft.classList.remove("fast-wing-bob");
                backWingRight.classList.remove("fast-wing-bob");

                bossState = "IDLE";

        }

        // Safety fallback: if the flying phase ended through another path, still

        }

        const p2StarCompatible = !featherAttackActive && bossState !== "P2_CENTER_SPIKE" && (bossState === "IDLE" ||

            bossState === "P2_HAND_BARRAGE" || bossState === "P2_FLAMETHROWER");
        const p2StarMax = p2OverlapUnlocked ? 2 : 1;
        if (p2StarAttackUnlocked && p2StarCompatible && activeStarOutlines.length < p2StarMax && time > nextStarSpawnTime) {
            const starRadius = (78 / 2) * scale;

        const targetWingAnim = featherAttackActive ? 1 : 0;

        backWingLeft.style.transformOrigin = "90% 40%";
        backWingLeft.style.transform = `rotate(${-wingAnimProgress * 96 + wingFlapOffset * 1.25}deg) translateY(${-wingAnimProgress * 28}px) scale(${(1 + wingAnimProgress * 0.38) * wingScaleBonus})`;

        backWingRight.style.transformOrigin = "10% 40%";
        backWingRight.style.transform = `rotate(${wingAnimProgress * 96 - wingFlapOffset * 1.25}deg) translateY(${wingAnimProgress * 28}px) scale(${(1 + wingAnimProgress * 0.38) * wingScaleBonus})`;

        if (bossState === "P2_CENTER_SPIKE" && featherAttackActive) {

        if (featherAttackActive) {

                        bossProjectiles.push({

                });
                nextFeatherSpawnTime = time + 110;

        }

        if (p2Enraged && !inP2Transition && bossState !== "P2_CENTER_SPIKE" && time > nextEnragedBurstTime) {

            const baseAngle = Math.atan2(playerY - chestY, playerX - chestX);
            for (let f = 0; f < 3; f++) {

                bossProjectiles.push({ type: "flame_circle", x: chestX, y: chestY, vx: Math.cos(a) * (8 + Math.random() * 3), vy: Math.sin(a) * (8 + Math.random() * 3), radius: 8, maxRadius: 38 + Math.random() * 18, growRate: 0.9, alpha: 1, color: "#ff0000", hitRadius: 8 });
            }

        // Late phase-2 overlap: add one controlled secondary pattern only to

                bossState === "P2_HAND_BARRAGE";

            if (overlapCompatible) {
                featherAttackActive = true;
                featherAttackEndTime = time + 2800;
                nextFeatherSpawnTime = time;

            } else if (bossState === "P2_CENTER_SPIKE" || bossState === "P2_FLAMETHROWER") {

                p2OverlapNextTime = time + 300;

        }

        if (bossState === "IDLE" && !inP2Transition) {

            if (time > nextAttackTime && !featherAttackActive) {
                let p2Attacks = [1, 2];

                if (p2FlamethrowerUnlocked) p2Attacks.push(4);
                if (p2CenterSpikeUnlocked) p2Attacks.push(5);

                if (p2FeatherAttackUnlocked && lastAttackType !== 6 && Math.random() < 0.22) {

                }

                if (p2Attacks.length > 1) {
                    p2Attacks = p2Attacks.filter(a => a !== lastAttackType);
                }
                const chosen = p2Attacks[Math.floor(Math.random() * p2Attacks.length)];
                lastAttackType = chosen;

                if (chosen === 6) {
                    featherAttackActive = true;
                    featherAttackEndTime = time + 6500;
                    nextFeatherSpawnTime = time;
                }
                else if (chosen === 1) {
                    bossState = "P2_LASER_PREP";
                    laserSweepDir = Math.random() < 0.5 ? 1 : -1;

                }
                else if (chosen === 2) {
                    bossState = "P2_RAIN_FOUNTAIN";
                    stateTimer = time + 1800;

                }
                else if (chosen === 3) {
                    bossState = "P2_HAND_BARRAGE";
                    p2HandBarrageEndTime = time + 8000;
                    p2HandBarrageNextShotTime = time;
                    
                    leftHand.style.left = "240px";
                    leftHand.style.top = "240px";

                    rightHand.style.top = "240px";

                else if (chosen === 4) {

                    p2FlamethrowerEndTime = time + 5000;
                    p2FlamethrowerNextShotTime = time;

                    leftHand.style.top = "210px";
                    leftHand.style.transform = "rotate(-45deg)";

                    rightHand.style.top = "210px";
                    rightHand.style.transform = "rotate(45deg)";

                        warningEndTime: time + 1500,
                        attackStartTime: time + 1500,

                    });
                }

        }
        else if (bossState === "P2_CENTER_SPIKE") {

        }
        else if (bossState === "P2_LASER_PREP") {

        else if (bossState === "P2_LASER_FIRE") {

            laserCurrentAngle = (laserSweepDir === 1 ? Math.PI * 0.85 : Math.PI * 0.15) + (laserTargetAngle - (laserSweepDir === 1 ? Math.PI * 0.85 : Math.PI * 0.15)) * progress;

            const endX = laserOriginX + Math.cos(laserCurrentAngle) * 2000;
            const endY = laserOriginY + Math.sin(laserCurrentAngle) * 2000;

            ctx.save();
            ctx.strokeStyle = "rgba(255, 0, 0, 0.35)";
            ctx.lineWidth = 28;
            ctx.beginPath();
            ctx.moveTo(laserOriginX, laserOriginY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            ctx.strokeStyle = "#ff0033";
            ctx.lineWidth = 14;
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ff0000";
            ctx.stroke();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.restore();

            if (!isDying && !isDead) {
                const dx = endX - laserOriginX;
                const dy = endY - laserOriginY;
                const lenSq = dx * dx + dy * dy;
                const proj = ((playerX - laserOriginX) * dx + (playerY - laserOriginY) * dy) / lenSq;
                
                if (proj >= 0 && proj <= 1) {
                    const closestX = laserOriginX + proj * dx;
                    const closestY = laserOriginY + proj * dy;
                    const dist = Math.hypot(playerX - closestX, playerY - closestY);
                    if (dist < 14 + playerHitRadius) {
                        damagePlayer(2, time, 0);
                    }
                }
            }

            if (time > stateTimer) {
                bossState = "IDLE";
                nextAttackTime = time + 2000;
            }
        }
        else if (bossState === "P2_RAIN_FOUNTAIN") {
            if (time > rainNextDropTime) {
                const eyeX = destroyerX + 352 + (344 - 352) * scale;
                const eyeY = destroyerY + 223 * scale;

                for (let f = 0; f < 5; f++) {
                    particles.push({
                        x: eyeX + (Math.random() - 0.5) * 24,
                        y: eyeY,
                        vx: (Math.random() - 0.5) * 6,
                        vy: -12 - Math.random() * 9,
                        alpha: 1,
                        decay: 0.02,
                        size: 3.5 + Math.random() * 3.5,
                        color: "#ff0033"
                    });
                }
                rainNextDropTime = time + 35;
            }

            if (time > stateTimer) {
                bossState = "P2_RAIN_FALL";
                rainSpawnEndTime = time + 3500; 
                rainNextDropTime = time;
                stateTimer = time + 4800;
            }

        else if (bossState === "P2_RAIN_FALL") {
            if (time < rainSpawnEndTime && time > rainNextDropTime) {
                for (let r = 0; r < 4; r++) {
                    bgProjectiles.push({
                        type: "raindrop",
                        x: Math.random() * innerWidth,
                        y: -30,
                        vy: 13 + Math.random() * 8,
                        vx: (Math.random() - 0.5) * 1.5,
                        size: 9,
                        hitRadius: 7
                    });
                }
                rainNextDropTime = time + 50;
            }

            if (time > stateTimer) {
                bossState = "IDLE";
                nextAttackTime = time + 1800;
            }
        }
        else if (bossState === "P2_HAND_BARRAGE") {
            if (time < p2HandBarrageEndTime) {
                if (time > p2HandBarrageNextShotTime) {
                    const leftHandX = destroyerX + 352 + (293 - 352) * scale;
                    const leftHandY = destroyerY + 263 * scale;
                    const rightHandX = destroyerX + 352 + (355 - 352) * scale;
                    const rightHandY = destroyerY + 263 * scale;

                    const leftAngle = Math.atan2(playerY - leftHandY, playerX - leftHandX);
                    const rightAngle = Math.atan2(playerY - rightHandY, playerX - rightHandX);

                    for (let tIdx = -1; tIdx <= 1; tIdx++) {
                        const lVarAngle = leftAngle + tIdx * 0.22;
                        const rVarAngle = rightAngle + tIdx * 0.22;

                        bossProjectiles.push({
                            type: "rounded_triangle",
                            x: leftHandX, y: leftHandY,
                            vx: Math.cos(lVarAngle) * 15,
                            vy: Math.sin(lVarAngle) * 15,
                            angle: lVarAngle,

                        });

                        bossProjectiles.push({
                            type: "rounded_triangle",
                            x: rightHandX, y: rightHandY,
                            vx: Math.cos(rVarAngle) * 15,
                            vy: Math.sin(rVarAngle) * 15,
                            angle: rVarAngle,
                            hitRadius: 10
                        });
                    }

                }
            } else {

                leftHand.style.top = "263px";
                rightHand.style.left = "355px";

        else if (bossState === "P2_FLAMETHROWER") {

                if (time > p2FlamethrowerNextShotTime) {
                    const chestX = destroyerX + 352 + (344 - 352) * scale;
                    const chestY = destroyerY + 235 * scale;
                    const baseAngle = Math.atan2(playerY - chestY, playerX - chestX);

                    for (let fCount = 0; fCount < 2; fCount++) {
                        const spreadAngle = baseAngle + (Math.random() - 0.5) * 0.38;
                        const spd = 7 + Math.random() * 4;

                        bossProjectiles.push({
                            type: "flame_circle",
                            x: chestX,
                            y: chestY,
                            vx: Math.cos(spreadAngle) * spd,
                            vy: Math.sin(spreadAngle) * spd,

                            maxRadius: 42 + Math.random() * 18,
                            growRate: 0.7 + Math.random() * 0.4,

                            color: Math.random() > 0.5 ? "#ff0000" : "#cc0000",

                    p2FlamethrowerNextShotTime = time + 45;

                nextAttackTime = time + 1800;
            }
        }
    }

    updateSceneTransforms();

    floorSpikeHeight += (targetFloorSpikeHeight - floorSpikeHeight) * 0.1;
    if (floorSpikeHeight > 1) {
        ctx.save();
        ctx.fillStyle = "#800000";
        ctx.strokeStyle = "#ff3333";
        ctx.lineWidth = 1.5;

        const spikeW = 20;
        const count = Math.ceil(innerWidth / spikeW);
        ctx.beginPath();
        ctx.moveTo(0, innerHeight);
        for (let s = 0; s <= count; s++) {
            const sx = s * spikeW;
            ctx.lineTo(sx - spikeW / 2, innerHeight - floorSpikeHeight);
            ctx.lineTo(sx, innerHeight);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        if (!isDying && !isDead && playerY >= innerHeight - floorSpikeHeight - playerHitRadius) {

        }
    }

    for (let i = bgProjectiles.length - 1; i >= 0; i--) {

        p.y += p.vy;

        bgCtx.translate(p.x, p.y);

        bgCtx.shadowBlur = 12;
        bgCtx.shadowColor = "#ff0000";
        bgCtx.beginPath();
        bgCtx.moveTo(0, -p.size * 1.8);
        bgCtx.quadraticCurveTo(p.size, 0, 0, p.size);
        bgCtx.quadraticCurveTo(-p.size, 0, 0, -p.size * 1.8);
        bgCtx.fill();
        bgCtx.restore();

        if (!isDying && !isDead && Math.hypot(playerX - p.x, playerY - p.y) < p.hitRadius + playerHitRadius) {
            damagePlayer(4, time, 0);
            bgProjectiles.splice(i, 1);
