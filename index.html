        }

        if (p.y > innerHeight + 40) {
            bgProjectiles.splice(i, 1);
            continue;
        }
    }

    for (let i = activeStarOutlines.length - 1; i >= 0; i--) {
        let star = activeStarOutlines[i];
        let alpha = 1;
        const elapsed = time - star.spawnTime;

        if (elapsed < star.fadeInDuration) {
            alpha = elapsed / star.fadeInDuration;
            star.state = "fadeIn";
        } else if (elapsed < star.fadeInDuration + star.activeDuration) {
            alpha = 1;
            star.state = "active";
            
            if (!star.expanded && elapsed >= 1200) {
                star.expanded = true;
                for (let pt = 0; pt < 5; pt++) {
                    const ptAngle = star.angle + (pt * Math.PI * 2 / 5) - Math.PI / 2;
                    const tipX = star.x + Math.cos(ptAngle) * star.radius;
                    const tipY = star.y + Math.sin(ptAngle) * star.radius;
                    
                    for (let st = 0; st < 6; st++) {
                        const strandAng = ptAngle + (Math.random() - 0.5) * 0.45;
                        bossProjectiles.push({
                            type: "star_strand",
                            x: tipX, y: tipY,
                            vx: Math.cos(strandAng) * (13.5 + Math.random() * 7.5),
                            vy: Math.sin(strandAng) * (13.5 + Math.random() * 7.5),
                            hitRadius: 5,
                            expireTime: time + 1800
                        });
                    }
                }
            }
        } else if (elapsed < star.fadeInDuration + star.activeDuration + star.fadeOutDuration) {
            alpha = 1 - (elapsed - star.fadeInDuration - star.activeDuration) / star.fadeOutDuration;
            star.state = "fadeOut";
        } else {
            activeStarOutlines.splice(i, 1);
            continue;
        }

        star.angle += star.spinSpeed;

        ctx.save();
        ctx.globalAlpha = alpha * 0.85;
        ctx.strokeStyle = "#ff0033";
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff0000";

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        for (let pt = 0; pt < 5; pt++) {
            const outerAngle = star.angle + (pt * Math.PI * 2 / 5) - Math.PI / 2;
            const innerAngle = star.angle + ((pt + 0.5) * Math.PI * 2 / 5) - Math.PI / 2;
            const outerX = star.x + Math.cos(outerAngle) * star.radius;
            const outerY = star.y + Math.sin(outerAngle) * star.radius;
            const innerX = star.x + Math.cos(innerAngle) * (star.radius * 0.45);
            const innerY = star.y + Math.sin(innerAngle) * (star.radius * 0.45);

            if (pt === 0) ctx.moveTo(outerX, outerY);
            else ctx.lineTo(outerX, outerY);
            ctx.lineTo(innerX, innerY);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }

    const bossCenterX = destroyerX + 352 + (344 - 352) * scale; 
    const bossCenterY = destroyerY + 213.5 * scale;
    const bossHitRadius = 38 * scale * bossExtraScale; 

    for (let i = playerBullets.length - 1; i >= 0; i--) {
        let b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (!isDying || wallClosingActive) {
            const dist = Math.hypot(b.x - bossCenterX, b.y - bossCenterY);
            if (dist < bossHitRadius) {
                // During the flying phase, stop exactly at the 20 HP endpoint.
                // This prevents a fast bullet stream from skipping the phase end.
                bossHp = inP2Transition ? Math.max(20, bossHp - 1) : bossHp - 1;

                if (inP2Transition) {
                    p2TransitionDamageDealt += 1;
                }

                updateBossHP();
                playerBullets.splice(i, 1);
                
                particles.push({
                    x: b.x, y: b.y,
                    vx: -b.vx * 0.2 + (Math.random()-0.5)*2,
                    vy: -b.vy * 0.2 + (Math.random()-0.5)*2,
                    alpha: 1, decay: 0.05, size: 3, color: "#fff"
                });

                if (bossHp <= maxBossHp * 0.66 && phase === 1) {
                    enterPhase2();
                }
                continue;
            }
        }

        if (b.x < 0 || b.x > innerWidth || b.y < 0 || b.y > innerHeight) {
            playerBullets.splice(i, 1);
        }
    }

    for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        let p = bossProjectiles[i];
        
        if (p.type === "floor_ceiling_diamond_spikes") {
            const progress = Math.min(1, Math.max(0, (time - p.attackStartTime) / (p.attackEndTime - p.attackStartTime)));
            const warning = time < p.warningEndTime;
            const rise = warning ? 0 : Math.min(1, (time - p.attackStartTime) / 1100);
            const halfGap = p.gapHeight / 2;
            const centerY = innerHeight / 2;
            const spacing = innerWidth / p.columnCount;
            const diamondWidth = Math.min(spacing * 0.58, 58);

            ctx.save();
            if (warning) {
                const pulse = 1 + Math.sin(time * 0.018) * 0.08;
                ctx.strokeStyle = "#ff3333";
                ctx.lineWidth = 3;
                ctx.shadowBlur = 14;
                ctx.shadowColor = "#ff0000";
                for (let c = 0; c < p.columnCount; c++) {
                    const cx = (c + 0.5) * spacing;
                    ctx.beginPath();
                    ctx.moveTo(cx, centerY - halfGap * pulse);
                    ctx.lineTo(cx + diamondWidth * pulse, centerY);
                    ctx.lineTo(cx, centerY + halfGap * pulse);
                    ctx.lineTo(cx - diamondWidth * pulse, centerY);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();
            } else {
                const maxSpikeHeight = centerY - 10;
                const currentSpikeHeight = maxSpikeHeight * rise;
                ctx.globalAlpha = 0.98;
                ctx.fillStyle = "#800000";
                ctx.strokeStyle = "#ff3333";
                ctx.lineWidth = 2;

                for (let c = 0; c < p.columnCount; c++) {
                    const cx = (c + 0.5) * spacing;
                    const gapY = centerY;
                    const topTipY = gapY - halfGap;
                    const bottomTipY = gapY + halfGap;
                    const leftX = c * spacing;
                    const rightX = (c + 1) * spacing;
                    const toothW = Math.min(spacing * 0.46, 42);

                    // Ceiling spikes point downward, stopping at the top of each
                    // diamond hole. Floor spikes point upward to the bottom of it.
                    for (let side = 0; side < 2; side++) {
                        const fromTop = side === 0;
                        const edgeY = fromTop ? 0 : innerHeight;
                        const tipY = fromTop
                            ? topTipY + (centerY - halfGap - topTipY) * (1 - rise)
                            : bottomTipY - (bottomTipY - centerY + halfGap) * (1 - rise);
                        const baseY = fromTop ? currentSpikeHeight : innerHeight - currentSpikeHeight;

                        // Use a row of narrow triangular teeth with the center gap
                        // preserved as a diamond-shaped passage.
                        const ySign = fromTop ? 1 : -1;
                        ctx.beginPath();
                        ctx.moveTo(leftX, edgeY);
                        ctx.lineTo(rightX, edgeY);
                        ctx.lineTo(cx + toothW, baseY);
                        ctx.lineTo(cx, tipY);
                        ctx.lineTo(cx - toothW, baseY);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                }
                ctx.restore();

                if (!isDying && !isDead && rise > 0.05) {
                    // Damage only when the player is outside a diamond hole.
                    let inHole = false;
                    for (let c = 0; c < p.columnCount; c++) {
                        const cx = (c + 0.5) * spacing;
                        const nx = Math.abs(playerX - cx) / diamondWidth;
                        const ny = Math.abs(playerY - centerY) / halfGap;
                        if (nx + ny <= 1) {
                            inHole = true;
                            break;
                        }
                    }
                    if (!inHole && (playerY < currentSpikeHeight || playerY > innerHeight - currentSpikeHeight)) {
                        damagePlayer(10, time);
                    }
                }

                if (time >= p.attackEndTime) {
                    bossProjectiles.splice(i, 1);
                    continue;
                }
            }
        }
        else if (p.type === "boomerang") {
            if (p.state === "outward" && time > p.returnTime) {
                p.state = "returning";
                const angle = Math.atan2(playerY - p.y, playerX - p.x);
                p.vx = Math.cos(angle) * 11;
                p.vy = Math.sin(angle) * 11;
            }
            
            p.x += p.vx;
            p.y += p.vy;
            p.rot += 0.3;
            
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = "#ff0033";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI, false);
            ctx.arc(0, 6, 12, Math.PI, 0, true);
            ctx.fill();
            ctx.restore();
            
            if (p.state === "returning" && 
               (p.x < -300 || p.x > innerWidth + 300 || p.y < -300 || p.y > innerHeight + 300)) {
                bossProjectiles.splice(i, 1);
                continue;
            }
        } 
        else if (p.type === "ball_bullet") {
            p.x += p.vx;
            p.y += p.vy;
            
            ctx.fillStyle = "#ff0033";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.hitRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            if (p.x < -20 || p.x > innerWidth + 20 || p.y < -20 || p.y > innerHeight + 20) {
                bossProjectiles.splice(i, 1);
                continue;
            }
        }
        else if (p.type === "rounded_triangle") {
            p.x += p.vx;
            p.y += p.vy;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = "#ff0033";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.moveTo(18, 0);
            ctx.lineTo(-12, -12);
            ctx.quadraticCurveTo(-16, 0, -12, 12);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            if (p.x < -50 || p.x > innerWidth + 50 || p.y < -50 || p.y > innerHeight + 50) {
                bossProjectiles.splice(i, 1);
                continue;
            }
        }
        else if (p.type === "flame_circle") {
            p.x += p.vx;
            p.y += p.vy;

            if (p.radius < p.maxRadius) {
                p.radius += p.growRate;
            }
            p.hitRadius = p.radius * 0.82;
            p.alpha -= 0.007;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.globalAlpha = Math.max(0, p.alpha);

            const grad = ctx.createRadialGradient(0, 0, p.radius * 0.15, 0, 0, p.radius);
            grad.addColorStop(0, "#ff6666");
            grad.addColorStop(0.35, "#ff0000");
            grad.addColorStop(0.7, p.color);
            grad.addColorStop(1, "rgba(120, 0, 0, 0)");

            ctx.fillStyle = grad;
            ctx.shadowBlur = 16;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (p.alpha <= 0 || p.x < -120 || p.x > innerWidth + 120 || p.y < -120 || p.y > innerHeight + 120) {
                bossProjectiles.splice(i, 1);
                continue;
            }

            if (!isDying && !isDead) {
                const hitDist = Math.hypot(p.x - playerX, p.y - playerY);
                if (hitDist < p.hitRadius + playerHitRadius) {
                    damagePlayer(2, time, 0);
                }
            }
        }
        else if (p.type === "feather") {
            p.waveOffset += p.waveFreq;
            const lateralOffset = Math.sin(p.waveOffset) * p.waveAmp;
            p.x += p.vx + lateralOffset;
            p.y += p.vy;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(Math.atan2(p.vy, p.vx + lateralOffset));
            ctx.fillStyle = "#ff1a40";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.moveTo(21, 0);
            ctx.quadraticCurveTo(0, -10.5, -24.5, -3.5);
            ctx.quadraticCurveTo(-7, 0, -24.5, 3.5);
            ctx.quadraticCurveTo(0, 10.5, 21, 0);
            ctx.fill();
            ctx.restore();

            if (p.x < -60 || p.x > innerWidth + 60 || p.y > innerHeight + 60) {
                bossProjectiles.splice(i, 1);
                continue;
            }
        }
        else if (p.type === "star_strand") {
            if (time > p.expireTime || p.x < -100 || p.x > innerWidth + 100 || p.y < -100 || p.y > innerHeight + 100) {
                bossProjectiles.splice(i, 1);
                continue;
            }
            p.x += p.vx;
            p.y += p.vy;

            ctx.save();
            ctx.fillStyle = "#ff0033";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.hitRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (!isDying && !isDead && Math.hypot(playerX - p.x, playerY - p.y) < p.hitRadius + playerHitRadius) {
                damagePlayer(6, time, 0);
            }
        }
        else if (p.type === "edge_spike") {
            const dx = Math.cos(p.angle);
            const dy = Math.sin(p.angle);
            const len = p.length;
            const halfW = p.width / 2;

            if (time < p.triggerTime) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                
                ctx.fillStyle = "rgba(130, 0, 0, 0.35)";
                ctx.fillRect(0, -halfW, len, p.width);
                ctx.strokeStyle = "rgba(200, 30, 30, 0.75)";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(0, -halfW, len, p.width);
                ctx.restore();
            } else if (time < p.endTime) {
                const progress = Math.min(1, (time - p.triggerTime) / 100); 
                const fade = Math.max(0, 1 - (time - p.triggerTime - 100) / (p.endTime - p.triggerTime - 100)); 
                const currentLen = len * progress;
                
                ctx.save();
                ctx.globalAlpha = fade;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                
                ctx.fillStyle = "#7a0000";
                ctx.beginPath();
                ctx.moveTo(0, -halfW);
                ctx.lineTo(currentLen, 0);
                ctx.lineTo(0, halfW);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#b30000";
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(currentLen, 0);
                ctx.lineTo(0, halfW);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "#400000";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
                
                if (!isDying && !isDead) {
                    const vx = playerX - p.x;
                    const vy = playerY - p.y;
                    const proj = vx * dx + vy * dy;
                    if (proj > 0 && proj < currentLen) {
                        const perpDistSq = (vx * vx + vy * vy) - (proj * proj);
                        if (perpDistSq >= 0 && perpDistSq < Math.pow(halfW + playerHitRadius, 2)) {
                            damagePlayer(10, time, 150);
                        }
                    }
                }
            } else {
                bossProjectiles.splice(i, 1);
                continue;
            }
        }
        else if (p.type === "slam_strand_spike") {
            const dx = Math.cos(p.angle);
            const dy = Math.sin(p.angle);
            const len = p.length;
            const halfW = p.width / 2;

            if (time < p.triggerTime) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = "rgba(180, 0, 0, 0.3)";
                ctx.fillRect(0, -halfW, len, p.width);
                ctx.strokeStyle = "rgba(255, 50, 50, 0.8)";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(0, -halfW, len, p.width);
                ctx.restore();
            } else if (time < p.endTime) {
                const progress = Math.min(1, (time - p.triggerTime) / 120);
                const fade = Math.max(0, 1 - (time - p.triggerTime - 120) / (p.endTime - p.triggerTime - 120));
                const currentLen = len * progress;

                ctx.save();
                ctx.globalAlpha = fade;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                ctx.fillStyle = "#800000";
                ctx.beginPath();
                ctx.moveTo(0, -halfW);
                ctx.lineTo(currentLen * 0.3, -halfW * 0.8);
                ctx.lineTo(currentLen * 0.6, -halfW * 0.9);
                ctx.lineTo(currentLen, 0);
                ctx.lineTo(currentLen * 0.6, halfW * 0.9);
                ctx.lineTo(currentLen * 0.3, halfW * 0.8);
                ctx.lineTo(0, halfW);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#cc0000";
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(currentLen, 0);
                ctx.lineTo(0, halfW);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                if (!isDying && !isDead) {
                    const vx = playerX - p.x;
                    const vy = playerY - p.y;
                    const proj = vx * dx + vy * dy;
                    if (proj > 0 && proj < currentLen) {
                        const perpDistSq = (vx * vx + vy * vy) - (proj * proj);
                        if (perpDistSq >= 0 && perpDistSq < Math.pow(halfW * 0.8 + playerHitRadius, 2)) {
                            damagePlayer(10, time, 150);
                        }
                    }
                }
            } else {
                bossProjectiles.splice(i, 1);
                continue;
            }
        }
        else if (p.type === "orbit_spike") {
            const eyeX = destroyerX + 352 + (344 - 352) * scale;
            const eyeY = destroyerY + 223 * scale;

            if (time < p.shootTime) {
                if (p.dist < p.maxDist) p.dist += 4;
                p.angle += 0.03;
                p.x = eyeX + Math.cos(p.angle) * p.dist;
                p.y = eyeY + Math.sin(p.angle) * p.dist;
                p.rot = p.angle + Math.PI / 2;
            } else if (p.vx === 0 && p.vy === 0) {
                const targetAngle = Math.atan2(playerY - p.y, playerX - p.x);
                p.vx = Math.cos(targetAngle) * 12;
                p.vy = Math.sin(targetAngle) * 12;
                p.rot = targetAngle;
            } else {
                p.x += p.vx;
                p.y += p.vy;
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = "#ff0033";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.moveTo(16, 0);
            ctx.lineTo(-12, -8);
            ctx.lineTo(-6, 0);
            ctx.lineTo(-12, 8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            if (p.x < -100 || p.x > innerWidth + 100 || p.y < -100 || p.y > innerHeight + 100) {
                bossProjectiles.splice(i, 1);
                continue;
            }
        }

        if (p.type !== "flame_circle" && p.type !== "feather" && p.type !== "edge_spike" && p.type !== "slam_strand_spike" && p.type !== "floor_ceiling_diamond_spikes" && p.type !== "star_strand") {
            if (!isDying && !isDead) {
                const dist = Math.hypot(playerX - p.x, playerY - p.y);
                if (dist < p.hitRadius + playerHitRadius) {
                    const damage =
                        p.type === "boomerang" ? 8 :
                        p.type === "orbit_spike" ? 10 :
                        4;
                    damagePlayer(damage, time, 0);
                }
            }
        }
    }

    if (spiralActive) {
        if (time > spiralEndTime) {
            spiralActive = false;
        } else if (time > spiralNextSpawnTime) {
            spiralAngle += 0.22;
            for (let s = 0; s < 3; s++) {
                const ang = spiralAngle + (s * Math.PI * 2 / 3);
                bossProjectiles.push({
                    type: "ball_bullet",
                    x: spiralCenterX,
                    y: spiralCenterY,
                    vx: Math.cos(ang) * 5.5,
                    vy: Math.sin(ang) * 5.5,
                    hitRadius: 6
                });
            }
            spiralNextSpawnTime = time + 70;
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;

        if (pt.alpha <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    const eyeBaseX = destroyerX + 352 + (344 - 352) * scale;
    const eyeBaseY = destroyerY + 223 * scale;
    
    let lookTargetX = playerX;
    let lookTargetY = playerY;

    // Phase 1 orb attack: look down at the red orb being charged/fired.
    if (bossState === "ATTACK2_PREP" || bossState === "ATTACK2_GROW" || bossState === "ATTACK2_SHOOT") {
        lookTargetX = destroyerX + 352 + (344 - 352) * scale;
        lookTargetY = destroyerY + 340 * scale;
    }

    // Phase 2 laser attack: look along the exact direction of the laser.
    if (bossState === "P2_LASER_PREP" || bossState === "P2_LASER_FIRE") {
        const laserOriginX = destroyerX + 352 + (344 - 352) * scale;
        const laserOriginY = destroyerY + 245 * scale;
        const startAngle = laserSweepDir === 1 ? Math.PI * 0.85 : Math.PI * 0.15;
        const targetAngle = laserSweepDir === 1 ? Math.PI * 0.15 : Math.PI * 0.85;
        let laserLookAngle = startAngle;
        if (bossState === "P2_LASER_FIRE") {
            const progress = 1 - Math.max(0, (stateTimer - performance.now()) / 2600);
            laserLookAngle = startAngle + (targetAngle - startAngle) * progress;
        }
        lookTargetX = laserOriginX + Math.cos(laserLookAngle) * 2000;
        lookTargetY = laserOriginY + Math.sin(laserLookAngle) * 2000;
    }

    if (isDying && fallingParts.length > 0) {
        const fp = fallingParts[fallingParts.length - 1];
        lookTargetX = destroyerX + 352 + (fp.x - 352) * scale;
        lookTargetY = destroyerY + fp.y * scale;
    } else if (isDying && deathEyeTarget) {
        const targetX = parseFloat(deathEyeTarget.style.left) || 0;
        const targetY = parseFloat(deathEyeTarget.style.top) || 0;
        const targetWidth = deathEyeTarget.offsetWidth || 0;
        const targetHeight = deathEyeTarget.offsetHeight || 0;
        lookTargetX = destroyerX + 352 + (targetX + targetWidth / 2 - 352) * scale;
        lookTargetY = destroyerY + (targetY + targetHeight / 2) * scale;
    }

    const angleToPlayer = Math.atan2(lookTargetY - eyeBaseY, lookTargetX - eyeBaseX);
    const distToPlayer = Math.min(6 * scale, Math.hypot(lookTargetX - eyeBaseX, lookTargetY - eyeBaseY) * 0.02);

    const targetEyeX = Math.cos(angleToPlayer) * distToPlayer;
    const targetEyeY = Math.sin(angleToPlayer) * distToPlayer;
    
    currentEyeX += (targetEyeX - currentEyeX) * 0.1;
    currentEyeY += (targetEyeY - currentEyeY) * 0.1;

    const maxPupilDownOffset = 30;
    currentEyeY = Math.min(currentEyeY, maxPupilDownOffset);

    pupilPulseScale += (1 - pupilPulseScale) * 0.05;
    pupil.style.transform = `translate(${currentEyeX}px, ${currentEyeY}px) scale(${pupilPulseScale})`;

    if (isDying) {
        processDeathCutscene(time);
        
        for (let i = fallingParts.length - 1; i >= 0; i--) {
            let fp = fallingParts[i];
            fp.vy += 0.25;
            fp.y += fp.vy;
            fp.rot += fp.vr;
            fp.el.style.top = fp.y + "px";
            fp.el.style.transform = `rotate(${fp.rot}deg)`;

            if (destroyerY + fp.y * scale > innerHeight + 180) {
                fp.el.style.display = "none";
                fallingParts.splice(i, 1);
            }
        }

        if (fallingParts.length > 0) {
            deathEyeTarget = fallingParts[fallingParts.length - 1].el;
        }

        updateWallClosingPhase(time);
    }

    processEndingCinematic(time);
}

resetPhaseVisuals();
resizeCanvas();
updatePlayerHP();
updateBossHP();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
